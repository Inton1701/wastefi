# WasteFi DHCP Configuration for dnsmasq
# This configuration provides DHCP and DNS services for the captive portal

# Interface to bind to
interface=wlan0

# Don't bind to any other interfaces
bind-interfaces

# Domain name
domain=wastefi.local

# DHCP range - assign IPs from 192.168.4.10 to 192.168.4.100
# Lease time: 2 hours
dhcp-range=192.168.4.10,192.168.4.100,255.255.255.0,2h

# Default gateway
dhcp-option=3,192.168.4.1

# DNS servers
dhcp-option=6,192.168.4.1

# Set the DHCP server to authoritative mode
dhcp-authoritative

# Don't read /etc/hosts
no-hosts

# Don't read any other host files
addn-hosts=/dev/null

# Log DHCP requests
log-dhcp

# Log DNS queries
log-queries

# Never forward plain names (without a dot or domain part)
domain-needed

# Never forward addresses in the non-routed address spaces
bogus-priv

# Don't use upstream nameservers for plain names
# This forces all DNS queries to be resolved locally
no-resolv

# Set up DNS entries for captive portal
address=/#/192.168.4.1

# Override specific domains to point to our portal
address=/wastefi.local/192.168.4.1
address=/portal.wastefi.local/192.168.4.1

# Cache size
cache-size=1000

# Don't poll /etc/resolv.conf for changes
no-poll

# Local service only
local-service

# Expand hosts file entries with domain
expand-hosts

# Enable reverse DNS for local range
local=/wastefi.local/

# DHCP options
# Option 114: URL for captive portal
dhcp-option=114,http://192.168.4.1/

# Vendor class options for different devices
dhcp-vendorclass=set:android,android
dhcp-vendorclass=set:iphone,iPhone
dhcp-vendorclass=set:ipad,iPad
dhcp-vendorclass=set:ipod,iPod
dhcp-vendorclass=set:macos,Mac

# Configure captive portal detection URLs
# This helps devices automatically show the captive portal page

# For Apple devices
address=/captive.apple.com/192.168.4.1
address=/hotspot.apple.com/192.168.4.1

# For Android devices  
address=/connectivitycheck.gstatic.com/192.168.4.1
address=/clients3.google.com/192.168.4.1
address=/generate_204/192.168.4.1

# For Windows devices
address=/msftconnecttest.com/192.168.4.1
address=/msftncsi.com/192.168.4.1

# For general captive portal detection
address=/example.com/192.168.4.1
address=/httpbin.org/192.168.4.1
address=/detectportal.firefox.com/192.168.4.1

# Additional DNS overrides for common sites
# This ensures users are redirected to the portal
address=/google.com/192.168.4.1
address=/facebook.com/192.168.4.1
address=/twitter.com/192.168.4.1
address=/youtube.com/192.168.4.1
address=/instagram.com/192.168.4.1

# Enable TFTP if needed (disabled by default)
# enable-tftp
# tftp-root=/var/lib/tftpboot

# DNS server configuration
# Listen on all interfaces for DNS
listen-address=192.168.4.1

# Set DNS port
port=53

# Enable DNS security extensions (if needed)
# dnssec
# trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D

# Logging
log-facility=/var/log/dnsmasq.log