# WasteFi Network Interface Configuration
# Add this to /etc/dhcpcd.conf for Raspberry Pi

# Static IP configuration for wlan0 (Access Point)
interface wlan0
static ip_address=192.168.4.1/24
nohook wpa_supplicant

