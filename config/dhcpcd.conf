# WasteFi Network Interface Configuration
# For setup with external AP device (Comfast)

# ISP connection via ethernet (auto DHCP)
interface eth0
# Use DHCP to get IP from main router
# static ip_address=192.168.1.100/24
# static routers=192.168.1.1
# static domain_name_servers=8.8.8.8 8.8.4.4

# USB-to-Ethernet connection to Comfast AP
# This creates the captive portal network
interface eth1
static ip_address=192.168.4.1/24
# No default route - this is the AP network