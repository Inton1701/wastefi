# WasteFi - External AP Configuration
# 
# This file is not used since we're using an external Comfast AP device
# The Comfast device handles WiFi broadcasting and should be configured as:
#
# 1. Set Comfast to AP mode (Access Point)
# 2. Connect Comfast WAN port to Raspberry Pi USB-to-Ethernet adapter
# 3. Configure Comfast to:
#    - SSID: WasteFi-Portal (or your preferred name)
#    - Security: Open (no password) - for captive portal functionality
#    - IP Mode: Bridge mode (pass-through)
#    - DHCP: Disabled (Raspberry Pi handles DHCP via dnsmasq)
#
# The Raspberry Pi will:
# - Provide DHCP on eth1 (192.168.4.1/24)
# - Run captive portal on eth1
# - Route traffic between eth1 (AP network) and eth0/wlan1 (ISP)
#
# Network Flow:
# WiFi Clients → Comfast AP → eth1 → Raspberry Pi → eth0/wlan1 → Internet