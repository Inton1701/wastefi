# WasteFi Hostapd Configuration
# Access Point configuration for Raspberry Pi

# Interface to use for AP
interface=wlan0

# Driver interface
driver=nl80211

# Network name (SSID)
ssid=WasteFi-Portal

# WiFi channel (1-11 for 2.4GHz)
channel=7

# Hardware mode (g = 2.4GHz)
hw_mode=g

# Country code (change to your country)
country_code=US

# Enable 802.11n
ieee80211n=1

# Enable WMM (WiFi Multimedia)
wmm_enabled=1

# Enable 40MHz channels with 20ns guard interval
ht_capab=[HT40][SHORT-GI-20][DSSS_CCK-40]

# Maximum number of stations allowed
max_num_sta=20

# Beacon interval in kilo-microseconds (1024 µs)
beacon_int=100

# DTIM (delivery traffic information message)
dtim_period=2

# RTS/CTS threshold; -1 = disabled (default)
rts_threshold=-1

# Fragmentation threshold; -1 = disabled (default)
fragm_threshold=-1

# Use "iw list" to show device capabilities and modify ht_capab accordingly
# Some examples:
# ht_capab=[HT40-][SHORT-GI-20][SHORT-GI-40]
# ht_capab=[HT40+]
# ht_capab=[HT40-]

# Accept/deny lists
macaddr_acl=0

# Send empty SSID in beacons and ignore probe request frames
ignore_broadcast_ssid=0

# Authentication algorithm
auth_algs=1

# Set of accepted cipher suites
wpa=0

# No authentication (open network)
# For WPA2 security, uncomment and modify these lines:
# wpa=2
# wpa_passphrase=YourSecurePassword
# wpa_key_mgmt=WPA-PSK
# wpa_pairwise=TKIP
# rsn_pairwise=CCMP

# Logging
logger_syslog=0
logger_syslog_level=2
logger_stdout=1
logger_stdout_level=2

# IEEE 802.11ac
# Only if your hardware supports it
# ieee80211ac=1
# vht_capab=[VHT160]